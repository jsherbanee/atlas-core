[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core"
version = "0.1.0"
description = "Atlas Core estimating and project intelligence engine"
requires-python = ">=3.12"
authors = [
  { name = "Atlas Core" }
]
dependencies = [
  "pypdf>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "black>=24.10",
  "ruff>=0.0.280",
  "mypy>=1.9",
  "pre-commit>=4.5",
]
gui = [
  "streamlit>=1.37",
]

[project.scripts]
atlas = "atlas_core.cli.__main__:main"
atlas-core = "atlas_core.cli:main"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ['\.venv/','__pycache__/','\.pytest_cache/','dist/','build/','.git/','.idea/','.vscode/']

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
strict = false
files = ["atlas_core", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_core*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
