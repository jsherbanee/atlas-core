name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run formatter check
        run: black --check .
      - name: Run linter
        run: ruff check .
      - name: Run type check (no-new-errors against origin/main)
        run: |
          set -euo pipefail
          # ensure origin/main is available locally
          git fetch origin main --depth=1 || true

          # Save current workspace HEAD (PR commit) and verify later
          PR_HEAD=$(git rev-parse HEAD)

          # Create a detached git worktree for origin/main to run baseline mypy
          BASELINE_DIR=$(mktemp -d)
          git worktree add --detach "$BASELINE_DIR" origin/main
          # Run mypy in the baseline worktree and normalize diagnostics
          # Run mypy in the baseline worktree and normalize ONLY real diagnostic lines
          (cd "$BASELINE_DIR" && python -m mypy --show-error-codes > /tmp/mypy_origin_raw.txt 2>&1) || true
          # Filter lines shaped like: path/to/file.py:<line>: error: ... then normalize
          grep -E '^[^:]+:[0-9]+: error:' /tmp/mypy_origin_raw.txt | sed -E 's/^(.*):[0-9]+: (.*)$/\1: \2/' | sort -u > /tmp/mypy_origin_norm.txt || true

          # Clean up baseline worktree
          git worktree remove --force "$BASELINE_DIR" || true
          rm -rf "$BASELINE_DIR" || true

          # Run mypy in the PR workspace (current checkout) and normalize diagnostics only
          python -m mypy --show-error-codes > /tmp/mypy_pr_raw.txt 2>&1 || true
          grep -E '^[^:]+:[0-9]+: error:' /tmp/mypy_pr_raw.txt | sed -E 's/^(.*):[0-9]+: (.*)$/\1: \2/' | sort -u > /tmp/mypy_pr_norm.txt || true

          # Compare normalized diagnostics: file + message
          comm -23 /tmp/mypy_pr_norm.txt /tmp/mypy_origin_norm.txt > /tmp/mypy_new.txt || true

          origin_count=$(wc -l < /tmp/mypy_origin_norm.txt || true)
          new_count=$(wc -l < /tmp/mypy_new.txt || true)

          echo "mypy baseline (origin/main) diagnostic count: ${origin_count:-0}"
          echo "mypy new diagnostics introduced by PR: ${new_count:-0}"

          if [ -s /tmp/mypy_new.txt ]; then
            echo "New mypy diagnostics introduced by PR:" >&2
            cat /tmp/mypy_new.txt >&2
            exit 1
          fi

          # Assert the main workspace is still the PR commit
          echo "workspace HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
      - name: Run tests
        run: python -m pytest -q
