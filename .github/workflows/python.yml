name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run formatter check
        run: black --check .
      - name: Run linter
        run: ruff check .
      - name: Run type check (no-new-errors against origin/main)
        run: |
          set -euo pipefail
          # ensure origin/main is available
          git fetch origin main --depth=1 || true
          current_branch=$(git rev-parse --abbrev-ref HEAD)

          # Run mypy on origin/main (baseline)
          git checkout --detach origin/main
          python -m mypy --show-error-codes || true
          python -m mypy --show-error-codes > /tmp/mypy_origin_raw.txt 2>&1 || true
          sed -E 's/^(.*):[0-9]+: (.*)$/\1: \2/' /tmp/mypy_origin_raw.txt | sort -u > /tmp/mypy_origin_norm.txt || true

          # Back to PR branch and run mypy
          git checkout --detach "$current_branch"
          python -m mypy --show-error-codes > /tmp/mypy_pr_raw.txt 2>&1 || true
          sed -E 's/^(.*):[0-9]+: (.*)$/\1: \2/' /tmp/mypy_pr_raw.txt | sort -u > /tmp/mypy_pr_norm.txt || true

          # Compare normalized diagnostics: file + message + code
          comm -23 /tmp/mypy_pr_norm.txt /tmp/mypy_origin_norm.txt > /tmp/mypy_new.txt || true

          origin_count=$(wc -l < /tmp/mypy_origin_norm.txt || true)
          new_count=$(wc -l < /tmp/mypy_new.txt || true)

          echo "mypy baseline (origin/main) diagnostic count: ${origin_count:-0}"
          echo "mypy new diagnostics introduced by PR: ${new_count:-0}"

          if [ -s /tmp/mypy_new.txt ]; then
            echo "New mypy diagnostics introduced by PR:" >&2
            cat /tmp/mypy_new.txt >&2
            exit 1
          fi
      - name: Run tests
        run: python -m pytest -q
